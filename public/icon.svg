<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Ursella Dark Canvas Surface Container -->
  <rect width="512" height="512" rx="128" fill="#070809" />
  <rect x="12" y="12" width="488" height="488" rx="116" stroke="#272A2F" stroke-width="3" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#10B981" stroke-width="2" stroke-opacity="0.2" />

  <!-- Background Subtle Architectural Ambient Radial -->
  <circle cx="256" cy="256" r="180" fill="url(#ambient_glow)" opacity="0.35" />

  <!-- Definitions -->
  <defs>
    <radialGradient id="ambient_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ursella_emerald_primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="ursella_core_diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="subtle_drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ursella Abstract Geometric Octopus Vector Scaled to 512x512 -->
  <g filter="url(#subtle_drop)" transform="translate(48, 48) scale(13)">
    {/* 1. Central Mantle Dome */}
    <path
      d="M10.8 11.8 C10.8 6.6 13.1 4.5 16 4.5 C18.9 4.5 21.2 6.6 21.2 11.8 C21.2 14.2 19.8 16 16 16 C12.2 16 10.8 14.2 10.8 11.8 Z"
      fill="url(#ursella_emerald_primary)"
    />

    {/* 2. Outer Tentacles */}
    <path
      d="M11 9 C7.5 9.5 4.5 12 4.5 15.5 C4.5 19 6.8 21.5 8 21.5 C9.2 21.5 9.5 20.2 9 19 C8.2 17.2 7 15.8 7 14.2 C7 12.5 9.2 11 11.8 10.5 Z"
      fill="url(#ursella_emerald_primary)"
    />
    <path
      d="M21 9 C24.5 9.5 27.5 12 27.5 15.5 C27.5 19 25.2 21.5 24 21.5 C22.8 21.5 22.5 20.2 23 19 C23.8 17.2 25 15.8 25 14.2 C25 12.5 22.8 11 20.2 10.5 Z"
      fill="url(#ursella_emerald_primary)"
    />

    {/* 3. Mid Tentacles */}
    <path
      d="M12.5 13.5 C10.2 14.8 7.8 17.5 7.8 21 C7.8 24.2 10 26.5 11.5 26.5 C12.8 26.5 13.2 25 12.5 23.8 C11.5 22 10.2 20.5 10.2 19 C10.2 17.2 11.8 15.8 13.8 14.8 Z"
      fill="url(#ursella_emerald_primary)"
    />
    <path
      d="M19.5 13.5 C21.8 14.8 24.2 17.5 24.2 21 C24.2 24.2 22 26.5 20.5 26.5 C19.2 26.5 18.8 25 19.5 23.8 C20.5 22 21.8 20.5 21.8 19 C21.8 17.2 20.2 15.8 18.2 14.8 Z"
      fill="url(#ursella_emerald_primary)"
    />

    {/* 4. Inner Tentacles (Subtle U Geometry) */}
    <path
      d="M14.2 15.2 C13 16.8 12.5 19.5 12.5 22.5 C12.5 25.8 14.2 27.5 16 27.5 C17.8 27.5 19.5 25.8 19.5 22.5 C19.5 19.5 19 16.8 17.8 15.2 C16.9 15.8 15.1 15.8 14.2 15.2 Z"
      fill="url(#ursella_emerald_primary)"
    />

    {/* 5. Center Apex AI Nexus Diamond */}
    <path
      d="M16 7.5 L18.4 9.9 L16 12.3 L13.6 9.9 Z"
      fill="url(#ursella_core_diamond)"
    />

    {/* Precision Micro Focus Anchor */}
    <circle cx="16" cy="9.9" r="0.75" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>

